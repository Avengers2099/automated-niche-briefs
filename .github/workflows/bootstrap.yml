name: Bootstrap source package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the uploaded launch package
        run: |
          unzip -o zero-cost-digital-business-launch.zip -d extracted || test -d extracted
          rm -f extracted/.github/workflows/main.yml
          cp -R extracted/. .
          rm -rf extracted
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet || git commit -m "Add automated business source"
          git push
